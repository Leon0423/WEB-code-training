<!-- > 取得標籤物件: 透過標籤的 ID 屬性建立連結 -->
<!-- - 1. 在 HTML 想要操作的標籤加上 id 屬性 -->
<!-- - 2. 在 JavaScript 程式中利用 document.querySelector() 取得標籤物件 -->
<!-- * 操作標籤物件: -->
<!-- - 1. 取得標籤物件 -->
<!-- - 2. 操作標籤物件的 HTML 和 CSS -->
<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta charset="UTF-8" />
		<title>JavaScript: HTML DOM 網頁畫面操作</title>
		<style>
			.tab-button {
				cursor: pointer;
				padding: 5px 10px;
			}
			.tab-content {
				display: none;
			}
			.tab-content.active {
				display: block;
			}
		</style>
	</head>
	<body>
		<div class="tab-container">
			<span class="tab-button">關於我</span>
			<span class="tab-button">學經歷</span>
		</div>
		<hr />
		<div id="about" class="tab-content active">大家好, 我是name</div>
		<div id="exps" class="tab-content">我是某某高中的學生，志向是軟體工程師</div>
		<script>
			// 取得所有需要的元素
			const tabButtons = document.querySelectorAll(".tab-button");
			const tabContents = document.querySelectorAll(".tab-content");

			// 為每個頁籤按鈕添加點擊事件
			tabButtons.forEach((button, index) => {
				button.addEventListener("click", () => {
					// 移除所有 active 類別
					tabContents.forEach((content) => {
						content.classList.remove("active");
					});
					tabButtons.forEach((btn) => {
						btn.classList.remove("active");
					});

					// 為當前選中的頁籤添加 active 類別
					button.classList.add("active");
					tabContents[index].classList.add("active");
				});
			});
		</script>

</html>
